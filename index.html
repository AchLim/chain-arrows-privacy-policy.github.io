<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chain Arrows</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      margin: 0;
      letter-spacing: 1px;
    }

    p {
      margin-top: 12px;
      font-size: 14px;
      color: #9aa4b2;
    }

    .dots span {
      animation: blink 1.4s infinite;
      font-size: 24px;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #666;
    }

    a {
      color: #4f8cff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Coming Soon</h1>

    <div class="dots">
      <span>.</span><span>.</span><span>.</span>
    </div>

    <p>A minimalist puzzle experience is on its way.</p>

    <div class="footer">
      Privacy Policy: <br />
      <a href="https://chainarrows.npinteractive.com/privacy-policy.html" target="_blank">
        chainarrows.npinteractive.com/privacy-policy.html
      </a>
    </div>

  </div>
</body>
</html>
